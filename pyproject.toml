[project]
name = "pdf-bench"
version = "1.0.0"
description = "Open-source benchmarking suite for PDF-to-Markdown conversion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "PDF-Bench Contributors"}
]
keywords = ["pdf", "markdown", "benchmark", "conversion", "evaluation", "document-processing", "nlp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "python-docx>=1.0.0",
    "docxtpl>=0.16.0",
    "mistune>=3.0.0",
    "pyyaml>=6.0",
    "python-levenshtein>=0.21.0",
    "sacrebleu>=2.3.0",
    "zss>=1.2.0",
    "requests>=2.31.0",
    "boto3>=1.40.73",
    "azure-ai-documentintelligence>=1.0.2",
    "datasets>=4.4.1",
    "python-dotenv>=1.2.1",
    "google-cloud-documentai>=3.7.0",
    "google-cloud-storage>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/pdf-bench"
Repository = "https://github.com/YOUR_USERNAME/pdf-bench"
Issues = "https://github.com/YOUR_USERNAME/pdf-bench/issues"
Documentation = "https://github.com/YOUR_USERNAME/pdf-bench#readme"
Changelog = "https://github.com/YOUR_USERNAME/pdf-bench/releases"

[project.optional-dependencies]
metrics = [
    "table-recognition-metric>=0.0.4",
]
parsers = [
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "unstructured>=0.10.0",
    "pikepdf>=9.0",  # Required for unstructured fast strategy
    "marker-pdf>=1.10.0",
]
ml-parsers = [
    "marker-pdf>=1.10.0",
    "torch>=2.5.0",
    "torchvision>=0.24.0",
]
commercial = [
    "boto3>=1.28.0",
    "azure-ai-formrecognizer>=3.3.0",
    "databricks-sql-connector>=3.0.0",
    "databricks-sdk>=0.30.0",
    "landingai-ade>=0.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[project.scripts]
pdfbench = "pdf_bench.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.git",
    "/.github/workflows",
    "/.vscode",
    "/corpus/academic",
    "/corpus/business/sec_edgar",
    "/corpus/business/sec_edgar_test",
    "/corpus/business/sec_optionc",
    "/corpus/business/govuk_pdf",
    "*.log",
    "*.pyc",
    "*.pyo",
    "*~",
    "/.pytest_cache",
    "/.mypy_cache",
    "/.ruff_cache",
    "/dist",
    "/build",
    "/__pycache__",
    "/node_modules",
    "/examples/*.pdf",
    "/batch_*.py",
    "/browser_*.py",
    "/chrome_*.py",
    "/download_*.py",
    "/find_*.py",
    "/save_*.py",
    "/sec_*.log",
    "/arxiv_*.log",
    "/*_manifest*.yaml",
    "TASK-*.md",
    "SEC_DOWNLOAD_SUMMARY.md",
    ".mcp.json",
    ".pre-commit-config.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["pdf_bench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N",  # pep8-naming
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"pdf_bench/main.py" = ["B008"]  # typer uses function calls in defaults

[tool.ruff.lint.isort]
known-first-party = ["pdf_bench"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=pdf_bench",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20250915",
]
