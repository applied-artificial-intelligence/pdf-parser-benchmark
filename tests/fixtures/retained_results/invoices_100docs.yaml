name: Invoice Documents Benchmark
description: '100 generated business invoices with varying complexity.

  Tests table extraction (line items), numerical parsing, and document structure.

  Ground truth from original markdown templates.

  '
corpus_dir: ../corpus
document_filter:
  domains:
  - invoices
  corpora: []
  features: []
  exclude_doc_ids: []
  include_doc_ids: []
  max_documents: null
parser_config:
  parsers:
  - docling
  - pymupdf4llm
  - pdfplumber
  - pymupdf
  - pypdfium2
  - pypdf
  - pdfminer
  - kreuzberg
  - marker
  - tika
  - unstructured
  parser_options: {}
metric_config:
  metrics:
  - edit_similarity
  - chrf++
  - character_error_rate
  - tree_similarity
  - element_f1
  - teds
output_config:
  results_dir: results
  save_format: json
  generate_report: false
  save_predictions: false
  verbose: true
parallel_workers: 1
