description: "GOV.UK publications corpus targets for PDF-Bench"
license: "Open Government Licence v3.0"
license_url: "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
source: "https://www.gov.uk/"
total_documents: 30
methodology: |
  Selection methodology:
  1. Searched GOV.UK publications across multiple categories (statistics, annual reports, policy papers, guidance)
  2. Prioritized publications from 2024-2025 to ensure current, accessible content
  3. Selected documents with confirmed PDF and HTML versions where possible
  4. Balanced across government departments, topics, and document types
  5. Verified Open Government Licence v3.0 applies to all selections
  6. Ensured variety in page count (10-338 pages) and complexity (simple text to table-heavy reports)

  Note: Some recent GOV.UK publications are HTML-only. Where HTML-only publications were selected,
  they represent important statistical releases or policy documents. PDF versions may be generated
  from HTML content for benchmarking purposes.

