name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up the frozen reconstruction Python
      run: uv python install 3.13.5

    - name: Install document-builder test tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer texlive-latex-base texlive-latex-recommended lmodern fonts-dejavu-core

    - name: Install dependencies
      run: |
        bash scripts/prepare_reconstruction_environment.sh

    - name: Run ruff check
      run: uv run --no-sync ruff check pdf_bench/ tests/
      continue-on-error: false

    - name: Run ruff format check
      run: uv run --no-sync ruff format --check pdf_bench/ tests/
      continue-on-error: false

    - name: Run mypy
      run: uv run --no-sync mypy pdf_bench/
      continue-on-error: false

    - name: Run tests with coverage
      run: uv run --no-sync pytest --cov=pdf_bench --cov-report=xml --cov-report=term -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  test-minimal:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install minimal dependencies
      run: uv sync --python ${{ matrix.python-version }} --no-dev

    - name: Run basic import test
      run: |
        uv run --no-sync python -c "import pdf_bench; print(f'PDF-Bench version: {pdf_bench.__version__}')"
        uv run --no-sync python -c "from pdf_bench.systems import PdfsmithAdapter; print('Core imports OK')"
