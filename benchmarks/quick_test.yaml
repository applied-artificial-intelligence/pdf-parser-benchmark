# PDF-Bench Quick Test - Fast benchmark for development/testing
#
# This benchmark runs 2 parsers on 3 documents with core metrics only.
# Use this for quick validation during development.

name: Quick Test Benchmark
description: >
  Fast benchmark for development and testing. Runs PyMuPDF (fast baseline) and
  Marker (high-quality ML) on 3 synthetic documents with core metrics only.
  Completes in ~1-2 minutes.

corpus_dir: ../corpus

document_filter:
  # Include only synthetic documents
  corpora:
    - synthetic
  # No domain filtering
  domains: []
  # No feature filtering
  features: []
  # Limit to just 3 documents for speed
  exclude_doc_ids: []
  include_doc_ids: []
  max_documents: 3

parser_config:
  # Just 2 parsers: fast baseline + high quality
  parsers:
    - pymupdf
    - marker
  # No special options needed
  parser_options: {}

metric_config:
  # Core metrics only
  metrics:
    # Text metrics (most important)
    - edit_similarity
    - chrf++
    # Structure metric (tree similarity)
    - tree_similarity
    # Element F1 (structure accuracy)
    - element_f1
  # Compute aggregate scores
  aggregate: true

output_config:
  # Save to results/ directory
  results_dir: results
  # Save as JSON only
  save_format: json
  # Generate HTML report
  generate_report: true
  # Auto-generate report path
  report_path: null
  # Don't save predictions (not needed for quick test)
  save_predictions: false
  # Show progress
  verbose: true

# Sequential execution (simpler for debugging)
parallel_workers: 1
