# Stratified Sample: Domain Coverage Demo
#
# 46 documents × 9 parsers = 414 tasks
# Runtime: ~1-2 hours with 2 workers (excluding marker_ollama due to extreme slowness)

name: Stratified Domain Sample
description: >
  Stratified sample covering all document categories for domain-specific analysis.
  31 synthetic + 15 business (5 each: legal, invoices, HR) = 46 total documents.

corpus_dir: ../corpus

document_filter:
  corpora: []
  domains: []
  features: []
  exclude_doc_ids: []
  include_doc_ids: []  # Empty = include all discovered
  max_documents: 46  # First 46 discovered (31 synthetic + ~15 business)

parser_config:
  parsers:
    - docling
    - pymupdf4llm
    - pdfplumber
    - pymupdf
    - pypdfium2
    - pypdf
    - extractous
    - unstructured
    - pdfminer

  parser_options:
    unstructured:
      strategy: fast

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate
    - tree_similarity
    - element_f1
    - teds
  aggregate: true

output_config:
  results_dir: results
  save_format: json
  generate_report: true
  report_path: results/stratified_sample_report.html
  save_predictions: true
  verbose: true

parallel_workers: 2
