parser_config:
  parsers:
    - docling
    - pymupdf4llm
    - pdfplumber
    - pymupdf
    - pypdfium2
    - pypdf
    - extractous
    - unstructured
    - pdfminer
    - kreuzberg

  parser_options:
    unstructured:
      strategy: fast

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate
    - tree_similarity
    - element_f1
    - teds

output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 50

execution:
  parallel_workers: 2
  timeout_seconds: 300
