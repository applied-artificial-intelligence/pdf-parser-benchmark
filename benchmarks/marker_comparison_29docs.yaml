# Marker vs Marker+Ollama Comparison Benchmark
# 29 synthetic documents - same set marker_ollama was tested on
# Purpose: Direct apples-to-apples comparison

name: Marker Comparison (29 synthetic docs)
description: >
  Direct comparison of marker vs marker_ollama on identical documents.
  These 29 synthetic documents were previously tested with marker_ollama.

corpus_dir: ../corpus

document_filter:
  include_doc_ids:
    - 06_docx_simple
    - 07_docx_tables
    - 08_docx_multicolumn
    - 09_table_simple_grid
    - 10_table_colspan
    - 11_table_wide
    - 12_table_multiple
    - 13_table_complex_headers
    - 15_list_simple_bullets
    - 16_list_numbered
    - 17_list_nested_2level
    - 18_list_nested_3level
    - 19_list_mixed_types
    - 20_list_with_paragraphs
    - 21_column_two_column
    - 22_column_three_column
    - 23_column_mixed_width
    - 24_column_newsletter
    - 25_column_academic
    - 26_column_brochure
    - 27_mixed_business_report
    - 28_mixed_technical_docs
    - 29_mixed_policy_doc
    - 30_mixed_meeting_minutes
    - 31_mixed_research_summary
    - syn-basic-001
    - syn-complex-001
    - syn-lists-001
    - syn-tables-001

parser_config:
  parsers:
    - marker

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate
    - tree_similarity
  aggregate: true

output_config:
  results_dir: results
  save_format: json
