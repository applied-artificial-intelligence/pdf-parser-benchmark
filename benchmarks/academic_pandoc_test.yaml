name: "Academic Papers - Pandoc Ground Truth Test"
description: "Test with LaTeX-derived Pandoc ground truth (1 paper) + element-specific metrics"

corpus_dir: ../corpus

document_filter:
  domains:
    - arxiv
  corpora: []
  features: []
  exclude_doc_ids: []
  include_doc_ids:
    - "arxiv-2302.14852"
  max_documents: 1

parser_config:
  parsers:
    - pypdfium2
    - pymupdf
    - marker
    - docling

  parser_options: {}

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate
    - latex_f1
    - element_f1

output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 5

execution:
  parallel_workers: 1
  timeout_seconds: 300
