# LlamaParse Full Corpus Benchmark
# Uses free tier (1,000 pages/day) - can run full corpus over 3 days
#
# Cost: FREE (within free tier limits)
#
# Note: Run in batches of ~1000 pages per day to stay within free tier

name: frontier_llamaparse_full
description: "LlamaParse benchmark - full corpus (free tier)"

corpus_dir: ../corpus

document_filter:
  # All domains
  domains:
    - synthetic
    - invoices
    - hr
    - legal_templates
    - legal_contracts

parser_config:
  parsers:
    - llamaparse

  parser_options:
    llamaparse:
      parsing_mode: cost_effective

metrics:
  - chrf
  - edit_similarity
  - tree_similarity
  - teds

output_config:
  results_dir: ../results
  save_predictions: true
