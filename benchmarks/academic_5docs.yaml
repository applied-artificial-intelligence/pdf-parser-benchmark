name: "Academic Papers - 5 arXiv Papers"
description: "Test equation extraction and two-column layouts on arXiv papers"

corpus_dir: ../corpus

document_filter:
  domains:
    - arxiv
  corpora: []
  features: []
  exclude_doc_ids: []
  include_doc_ids: []
  max_documents: null

parser_config:
  parsers:
    - pypdfium2
    - pymupdf
    - marker
    - docling

  parser_options: {}

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate

output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 5

execution:
  parallel_workers: 1
  timeout_seconds: 300
