parser_config:
  # Premium frontier models only
  parsers:
    - gemini_3_pro
    - gpt_5
    - claude_sonnet_4

metrics:
  - chrf
  - edit_similarity
  - tree_similarity

output_config:
  results_dir: ../results
  save_predictions: true
