# Frontier Premium Benchmark - ~300 pages
# For expensive frontier models: gemini_3_pro, gpt_5, claude_sonnet_4_5
#
# Estimated cost: ~$8-12 total for all 3 premium models
#
# Selection criteria:
# - Diverse document types (synthetic, invoices, HR, legal, contracts)
# - Manageable page counts (avoid 100+ page documents)
# - Representative of real-world use cases

name: frontier_premium_300p
description: "Premium frontier model benchmark (~300 pages) - diverse document types"

corpus_dir: ../corpus

document_filter:
  # Include specific documents for controlled testing
  include_doc_ids:
    # Synthetic (15 docs, ~20 pages) - test basic parsing capabilities
    - syn-basic-001
    - syn-basic-002
    - syn-basic-003
    - syn-basic-004
    - syn-basic-005
    - syn-tables-001
    - syn-tables-002
    - syn-tables-003
    - syn-tables-004
    - syn-tables-005
    - syn-columns-001
    - syn-columns-002
    - syn-mixed-001
    - syn-mixed-002
    - syn-mixed-003

    # Invoices (30 docs, ~50 pages) - structured data extraction
    - inv-001
    - inv-002
    - inv-003
    - inv-004
    - inv-005
    - inv-006
    - inv-007
    - inv-008
    - inv-009
    - inv-010
    - inv-011
    - inv-012
    - inv-013
    - inv-014
    - inv-015
    - inv-016
    - inv-017
    - inv-018
    - inv-019
    - inv-020
    - inv-021
    - inv-022
    - inv-023
