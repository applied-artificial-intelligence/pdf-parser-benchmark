name: "Academic Papers - 10 Diverse arXiv Papers (Fixed Parsers Only)"
description: "Test fixes for Databricks and Google Document AI"

corpus_dir: ../corpus

document_filter:
  domains:
    - arxiv
  corpora: []
  features: []
  exclude_doc_ids: []
  include_doc_ids: []
  max_documents: null

parser_config:
  parsers:
    - databricks
    - google_document_ai

  parser_options: {}

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate

output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 2

execution:
  parallel_workers: 1
  timeout_seconds: 300
