name: "SEC Filings - ALL"
description: "All SEC filings for outlier detection"
corpus_dir: ../corpus
document_filter:
  domains: [sec-edgar]
  corpora: [business]
  features: []
  exclude_doc_ids: []
  include_doc_ids: []
  max_documents: null
parser_config:
  parsers: [pypdfium2]
  parser_options: {}
metric_config:
  metrics: [edit_similarity, chrf++]
output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 10
parallel_workers: 1
execution:
  timeout_seconds: 300
