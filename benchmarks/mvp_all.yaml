# PDF-Bench MVP Benchmark - All Synthetic Documents, All Parsers
#
# This benchmark runs all 4 implemented parsers on the complete synthetic corpus
# with all available metrics. Use this for comprehensive evaluation.

name: MVP All Parsers Benchmark
description: >
  Comprehensive benchmark evaluating all 4 implemented parsers (PyMuPDF, pdfplumber,
  Marker, Unstructured) on the complete synthetic corpus. Computes all text, structure,
  table, and math metrics. This is the primary benchmark for validating parser implementations.

corpus_dir: ../corpus

document_filter:
  # Include all synthetic documents
  corpora:
    - synthetic
  # No domain filtering - include both pandoc and libreoffice
  domains: []
  # No feature filtering - include all documents regardless of features
  features: []
  # No exclusions
  exclude_doc_ids: []
  include_doc_ids: []
  # No limit - process all documents
  max_documents: null

parser_config:
  # All 4 implemented parsers
  parsers:
    - pymupdf
    - pdfplumber
    - marker
    - unstructured
  # Parser-specific options
  parser_options:
    unstructured:
      strategy: fast  # Use fast strategy for speed (can override with hi_res if needed)

metric_config:
  # Compute all available metrics
  metrics:
    # Text metrics
    - edit_distance
    - edit_similarity
    - character_error_rate
    - chrf++
    # Structure metrics
    - tree_edit_distance
    - tree_similarity
    - element_f1
    # Table metrics
    - teds
    - teds_with_content
    - cell_content_f1
    - cell_accuracy
    # Math metrics
    - latex_f1
    - latex_accuracy
  # Compute aggregate scores across all documents
  aggregate: true

output_config:
  # Save results to results/ directory
  results_dir: results
  # Save as JSON (most flexible for analysis)
  save_format: json
  # Generate HTML report
  generate_report: true
  # Auto-generate report path (results/mvp_all_report.html)
  report_path: null
  # Save parser predictions to disk for inspection
  save_predictions: true
  # Show detailed progress output
  verbose: true

# Use automatic parallelization (detect CPU count)
parallel_workers: 0
