# PDF-Bench Tables Benchmark - Focus on table extraction quality
#
# This benchmark evaluates parsers specifically on documents with tables,
# using table-focused metrics.

name: Tables Benchmark
description: >
  Specialized benchmark focusing on table extraction quality. Runs all parsers
  on documents tagged with the 'tables' feature and evaluates using table-specific
  metrics (TEDS, cell F1). Useful for comparing table extraction capabilities.

corpus_dir: corpus

document_filter:
  # Include all corpora
  corpora: []
  # No domain filtering
  domains: []
  # ONLY documents with tables
  features:
    - tables
  # No exclusions
  exclude_doc_ids: []
  include_doc_ids: []
  # No limit
  max_documents: null

parser_config:
  # All parsers - pdfplumber should excel here
  parsers:
    - pymupdf
    - pdfplumber
    - marker
    - unstructured
  parser_options: {}

metric_config:
  # Focus on table metrics + baseline text metrics
  metrics:
    # Basic text metrics for baseline
    - edit_similarity
    - chrf++
    # Table-specific metrics
    - teds
    - teds_with_content
    - cell_content_f1
    - cell_accuracy
    # Structure metrics (tables affect structure)
    - element_f1
  aggregate: true

output_config:
  results_dir: results
  save_format: json
  generate_report: true
  report_path: null
  save_predictions: true
  verbose: true

# Parallel execution
parallel_workers: 0
