# CUAD Real Contracts Benchmark: Text-Only Metrics
# Excludes tree_similarity which is O(n^4) and unusable for large documents

name: CUAD Text Metrics Benchmark
description: >
  Benchmark on real SEC filing contracts from the CUAD dataset.
  Uses text-based metrics only (no tree_similarity due to O(n^4) complexity).
  CUAD documents have 3000-10000+ AST nodes making tree edit distance infeasible.

corpus_dir: ../corpus

document_filter:
  corpora: []
  domains: []
  features: []
  exclude_doc_ids: []
  include_doc_ids:
    - cuad_000
    - cuad_001
    - cuad_002
    - cuad_003
    - cuad_004
    - cuad_005
    - cuad_006
    - cuad_007
    - cuad_008
    - cuad_009
    - cuad_010
    - cuad_011
    - cuad_012
    - cuad_013
    - cuad_014
    - cuad_015
    - cuad_016
    - cuad_017
    - cuad_018
    - cuad_019
    - cuad_020
    - cuad_021
    - cuad_022
    - cuad_023
    - cuad_024
    - cuad_025
    - cuad_026
    - cuad_027
    - cuad_028
    - cuad_029
    - cuad_030
    - cuad_031
    - cuad_032
    - cuad_033
    - cuad_034
    - cuad_035
    - cuad_036
    - cuad_037
    - cuad_038
    - cuad_039
