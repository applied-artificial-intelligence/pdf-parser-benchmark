  max_documents: null

parser_config:
  parsers:
    # Fast parsers for CUAD benchmark
    - pymupdf
    - pdfplumber
    - pypdf
    - pypdfium2
    - pdfminer
    - kreuzberg
    # marker excluded - not installed

  parser_options: {}

metric_config:
  metrics:
    # Text-based metrics - fast O(n) or O(n*m) at worst
    - edit_similarity
    - chrf++
    - character_error_rate
    # Element F1 is O(n) - just counting, no tree comparison
    - element_f1
    # TEDS only runs on tables, which are small
    - teds
    # EXCLUDED: tree_similarity - O(n^2 * m^2) Zhang-Shasha algorithm
    # With 3000-10000 AST nodes per CUAD document, this is infeasible

output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 25

execution:
  parallel_workers: 4
  timeout_seconds: 300
