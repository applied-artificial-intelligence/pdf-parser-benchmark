parser_config:
  parsers:
    # OCR-capable open source parsers only
    - docling          # Built-in OCR (EasyOCR by default)
    - marker           # Built-in OCR with surya
    - kreuzberg        # Tesseract OCR support
    - unstructured     # OCR via hi_res strategy
    - tika             # OCR via Tesseract server

  parser_options:
    unstructured:
      strategy: hi_res  # Required for OCR

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate
    - element_f1
    - teds

output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 20

execution:
  parallel_workers: 1  # Sequential due to high memory usage
  timeout_seconds: 600  # OCR is slow, 10 min timeout per doc
