# OmniDocBench English OCR Benchmark: 124 Documents x 5 OCR-capable Parsers
name: OmniDocBench English OCR Benchmark
description: >
  Benchmark on English documents from OmniDocBench using OCR-capable parsers only.
  Documents are image-based PDFs requiring OCR for text extraction.
  Focus on English content for fair OCR comparison (avoids CJK font issues).

