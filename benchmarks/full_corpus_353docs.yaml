# Full Corpus Benchmark: 353 Documents × 10 Parsers
#
# 353 documents × 10 parsers = 3,530 tasks
# Runtime: ~2-4 hours with 2 workers
# Includes CUAD real contracts for legal domain validation

name: Full Corpus Benchmark (353 docs)
description: >
  Comprehensive benchmark across all corpus domains including real CUAD contracts.
  - Synthetic: 31 docs
  - Business Legal (synthetic): 108 docs
  - Business CUAD (real contracts): 75 docs
  - Business Invoices: 100 docs
  - Business HR: 34 docs
  - Academic: 5 docs
  Total: 353 documents

corpus_dir: ../corpus

document_filter:
  corpora: []
  domains: []
  features: []
  exclude_doc_ids: []
  include_doc_ids: []  # Empty = include all discovered
  max_documents: null  # No limit - use all 353 documents

parser_config:
  parsers:
    - docling
    - pymupdf4llm
    - pdfplumber
    - pymupdf
    - pypdfium2
    - pypdf
    - extractous
    - unstructured
    - pdfminer
    - kreuzberg

  parser_options:
    unstructured:
      strategy: fast

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate
    - tree_similarity
    - element_f1
    - teds
  aggregate: true

output_config:
  results_dir: results
  save_format: json
  generate_report: true
  report_path: results/full_corpus_353docs_report.html
  save_predictions: true
  verbose: true

parallel_workers: 2
