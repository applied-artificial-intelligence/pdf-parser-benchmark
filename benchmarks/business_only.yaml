# PDF-Bench Business Documents Benchmark
#
# This benchmark focuses on business documents (government and corporate).
# NOTE: This corpus is not yet populated. Use this as a template.

name: Business Documents Benchmark
description: >
  Benchmark focused on business documents from government websites (GOV.UK)
  and corporate filings (SEC EDGAR). Tests parsers on forms, reports, and
  structured business documents.

  NOTE: Business corpus not yet populated. This is a template configuration.

corpus_dir: ../corpus

document_filter:
  # Include only business documents
  corpora:
    - business
  # Government and corporate domains
  domains:
    - gov-uk
    - sec-edgar
  # No specific feature filtering
  features: []
  exclude_doc_ids: []
  include_doc_ids: []
  # No limit - process all business documents
  max_documents: null

parser_config:
  # All parsers - business docs vary widely
  parsers:
    - pymupdf
    - pdfplumber  # Good for forms and tables
    - marker
    - unstructured
  # Parser-specific options
  parser_options:
    unstructured:
      strategy: fast  # Business docs are usually simpler
    pdfplumber:
      # pdfplumber excels at extracting tables from forms
      table_settings:
        snap_tolerance: 3

metric_config:
  # Focus on metrics important for business documents
  metrics:
    # Text metrics
    - edit_similarity
    - chrf++
    # Structure metrics
    - tree_similarity
    - element_f1
    # Table metrics (critical for forms and reports)
    - teds
    - teds_with_content
    - cell_content_f1
    - cell_accuracy
  aggregate: true

output_config:
  results_dir: results
  save_format: json
  generate_report: true
  report_path: null
  save_predictions: true
  verbose: true

# Parallel execution recommended
parallel_workers: 0
