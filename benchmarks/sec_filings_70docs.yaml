name: "SEC Filings - 70 Annual Reports"
description: "ARS annual report PDFs benchmarked against 10-K iXBRL HTML ground truth from SEC EDGAR. Excludes 19 glossy-only reports where ARS content diverges significantly from 10-K."

corpus_dir: ../corpus

document_filter:
  domains:
    - sec-edgar
  corpora:
    - business
  features: []
  exclude_doc_ids:
    # Glossy annual reports with low 10-K content overlap (edit_sim < 0.3)
    - sec-mcdonalds-2024
    - sec-costco_wholesale_new-2025
    - sec-warner_music-2025
    - sec-aramark-2025
    - sec-analog_devices-2025
    - sec-atmos_energy-2025
    - sec-emerson_electric-2025
    - sec-heico-2025
    - sec-state_street-2024
    - sec-truist_financial-2024
    - sec-salesforce-2025
    - sec-morgan_stanley-2024
    - sec-goldman_sachs-2024
    - sec-raymond_james_financial-2025
    - sec-wells_fargo-2024
    - sec-ibm-2024
    - sec-us_bancorp-2024
    - sec-acuity_de-2025
    - sec-intuit-2025
  include_doc_ids: []
  max_documents: null

parser_config:
  parsers:
    - pypdfium2
    - pymupdf
    - marker
    - docling

  parser_options: {}

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate
    - element_f1

output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 10

parallel_workers: 1

execution:
  timeout_seconds: 600
