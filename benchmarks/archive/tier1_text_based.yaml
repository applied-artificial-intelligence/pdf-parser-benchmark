# Tier 1: Text-Based Documents Benchmark
#
# Documents with embedded text (machine-readable PDFs).
# All parsers can handle these documents efficiently.
#
# Corpora: synthetic (31 docs), CUAD (75 docs), business
# Total: ~350 documents
#
# RESOURCE REQUIREMENTS:
#   - docling: ~8-12GB RAM per worker (use workers=1)
#   - pymupdf/pdfplumber: ~500MB RAM per worker (safe with workers=4)
#
# Estimated time:
#   - With docling (workers=1): 2-4 hours
#   - Without docling (workers=4): 30-60 minutes

name: "Tier 1: Text-Based Documents"
description: |
  Benchmark for machine-readable PDFs with embedded text.
  Includes synthetic test documents and real legal contracts.
  All parsers should work well on these documents.

corpus_dir: ../corpus

document_filter:
  # Include synthetic and business corpora (both text-based)
  corpora:
    - synthetic
    - business
  # Exclude OmniDocBench (requires OCR)
  exclude_doc_ids: []

parser_config:
  parsers:
    # Fast, lightweight parsers
    - pymupdf
    - pdfplumber
    # Heavy parsers (no OCR mode)
    - docling  # Fast mode, no OCR
    # Commented out - require extra installation:
    # - pymupdf4llm
    # - pypdf
    # - pypdfium2
    # - pdfminer
    # - kreuzberg
    # - extractous
    # - marker

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - tree_similarity
    - element_f1

output_config:
  results_dir: ../results/tier1
  checkpoint_interval: 20

execution_config:
  # IMPORTANT: docling is memory-intensive (~8-12GB per worker)
  # Use workers=1 when including docling to avoid OOM
  # For pymupdf/pdfplumber only, workers=4 is safe
  workers: 1
  timeout_per_document: 120
