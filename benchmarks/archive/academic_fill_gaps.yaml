name: "Academic - Fill Gaps"
description: "Run remaining 9 parsers on academic corpus for full coverage"

corpus_dir: ../corpus

document_filter:
  domains:
    - arxiv
  corpora: []
  features: []
  exclude_doc_ids: []
  include_doc_ids: []
  max_documents: null

parser_config:
  parsers:
    - extractous
    - kreuzberg
    - pdfminer
    - pdfplumber
    - pymupdf4llm
    - pypdf
    - pypdf2
    - tika
    - unstructured

  parser_options: {}

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate

output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 10

execution:
  parallel_workers: auto
  timeout_seconds: 300
