name: "Commercial Parsers - Full Benchmark"
description: "AWS Textract, Azure Document Intelligence, Google Document AI on all documents"

corpus_dir: ../corpus

document_filter:
  domains: []
  corpora:
    - synthetic
    - business
    - academic
  features: []
  exclude_doc_ids: []
  include_doc_ids: []
  max_documents: null

parser_config:
  parsers:
    - aws_textract
    - azure_document_intelligence
    - google_document_ai

  parser_options: {}

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate

output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 25

execution:
  parallel_workers: 4
  timeout_seconds: 120
