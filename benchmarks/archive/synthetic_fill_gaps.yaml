name: "Synthetic - Fill Gaps"
description: "Run remaining 4 parsers on synthetic corpus for full coverage"

corpus_dir: ../corpus

document_filter:
  domains: []
  corpora:
    - synthetic
  features: []
  exclude_doc_ids: []
  include_doc_ids: []
  max_documents: null

parser_config:
  parsers:
    - pdfplumber
    - pymupdf
    - pypdfium2
    - unstructured

  parser_options: {}

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate

output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 20

execution:
  parallel_workers: auto
  timeout_seconds: 300
