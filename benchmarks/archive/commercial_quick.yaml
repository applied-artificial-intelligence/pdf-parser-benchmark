name: Commercial Quick Test
description: Quick test of all 5 commercial parsers on 3 docs

corpus_dir: /home/stefan/applied-ai/pdf-bench/corpus

document_filter:
  include_doc_ids:
    - syn-basic-001
    - syn-lists-001
    - syn-tables-001

parser_config:
  parsers:
    - aws_textract
    - azure_document_intelligence
    - google_document_ai
    - databricks
    - landing_ai

metric_config:
  metrics:
    - edit_similarity
    - chrf++

output_config:
  results_dir: results
  save_format: json
  verbose: true

parallel_workers: 1
