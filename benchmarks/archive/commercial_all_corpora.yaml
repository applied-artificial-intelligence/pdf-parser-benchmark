name: "Commercial Parsers - All Corpora"
description: "Run AWS Textract, Azure Document Intelligence, and Google Document AI on all documents"

corpus_dir: ../corpus

document_filter:
  domains:
    - pandoc
    - libreoffice
    - tables
    - lists
    - multicolumn
    - mixed
    - legal
    - invoices
    - hr
    - arxiv
  corpora: []
  features: []
  # Exclude CUAD (run separately due to size)
  exclude_doc_ids:
    - cuad_000
    - cuad_001
    - cuad_002
    - cuad_003
    - cuad_004
    - cuad_005
    - cuad_006
    - cuad_007
    - cuad_008
    - cuad_009
    - cuad_010
    - cuad_011
    - cuad_012
