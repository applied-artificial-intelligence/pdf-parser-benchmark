  include_doc_ids: []
  max_documents: null

parser_config:
  parsers:
    - aws_textract
    - azure_document_intelligence
    # - google_document_ai  # Credentials file missing

  parser_options: {}

metric_config:
  metrics:
    - edit_similarity
    - chrf++
    - character_error_rate

output:
  format: json
  include_raw_output: false
  checkpointing: true
  checkpoint_interval: 10

execution:
  parallel_workers: 4
  timeout_seconds: 120
