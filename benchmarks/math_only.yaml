# PDF-Bench Math Benchmark - Focus on mathematical notation extraction
#
# This benchmark evaluates parsers specifically on documents with mathematical
# notation, using LaTeX-focused metrics.

name: Math Benchmark
description: >
  Specialized benchmark focusing on mathematical notation extraction quality.
  Runs all parsers on documents tagged with the 'math' feature and evaluates
  using LaTeX-specific metrics. Marker should excel here.

corpus_dir: corpus

document_filter:
  # Include all corpora
  corpora: []
  # No domain filtering
  domains: []
  # ONLY documents with math
  features:
    - math
  # No exclusions
  exclude_doc_ids: []
  include_doc_ids: []
  # No limit
  max_documents: null

parser_config:
  # All parsers - Marker should excel
  parsers:
    - pymupdf
    - pdfplumber
    - marker
    - unstructured
  parser_options: {}

metric_config:
  # Focus on LaTeX metrics + baseline text metrics
  metrics:
    # Basic text metrics for baseline
    - edit_similarity
    - chrf++
    # LaTeX-specific metrics
    - latex_f1
    - latex_accuracy
    # Structure metrics
    - element_f1
  aggregate: true

output_config:
  results_dir: results
  save_format: json
  generate_report: true
  report_path: null
  save_predictions: true
  verbose: true

# Parallel execution
parallel_workers: 0
