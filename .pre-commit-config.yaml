# Pre-commit hooks for PDF-Bench
# OPTIONAL: Install with `pre-commit install` if you want automatic checks
# Otherwise, run tools manually with: uv run ruff check . / uv run mypy pdf_bench/

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.6.1
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        files: ^pdf_bench/
